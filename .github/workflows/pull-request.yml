name: Repository validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, types, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Reject whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^..HEAD
          fi

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build production bundle
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
        run: npm run build --workspace @asados/web -- --webpack

      - name: Run hermetic tests
        run: >-
          npm run test:unit -- --allowOnly=false
          --exclude tests/unit/roles-authentication-e2e.test.ts
          --exclude tests/unit/web-client-operator-cart-flow.test.ts

      - name: Preload pinned Supabase images
        run: |
          mapfile -t images < <(sed -n '/^readonly -a required_images=(/,/^)/p' scripts/run-local-supabase-service-tests.sh \
            | grep -oE "'[^']+'" | tr -d "'")
          if [ "${#images[@]}" -eq 0 ]; then
            echo "No pinned images found in the service test runner." >&2
            exit 1
          fi
          for image in "${images[@]}"; do
            docker pull "$image"
          done

      - name: Run service-backed Supabase tests
        run: npm run test:unit:supabase
